<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#E6E1BC"/>
  <!-- T-Shirt Silhouette -->
  <g transform="translate(100, 70)">
    <!-- Body -->
    <path d="M120 20 C160 50, 240 50, 280 20 L350 70 L390 140 L330 170 L310 130 L310 440 L90 440 L90 130 L70 170 L10 140 L50 70 Z" fill="#141210" stroke="#24201C" stroke-width="3"/>
    <!-- Collar -->
    <path d="M120 20 C160 55, 240 55, 280 20 C250 40, 150 40, 120 20 Z" fill="#24201C"/>
    <!-- Sleeve Stitch Details -->
    <line x1="330" y1="170" x2="350" y2="125" stroke="#3A362B" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="70" y1="170" x2="50" y2="125" stroke="#3A362B" stroke-width="2" stroke-dasharray="3,3"/>
    <!-- Graphic Chest Print -->
    <g transform="translate(200, 190)" text-anchor="middle">
      <text y="0" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#D9D3A1" letter-spacing="4">DWIPARA PRESENT</text>
      <line x1="-70" y1="10" x2="70" y2="10" stroke="#D9D3A1" stroke-width="1.5"/>
      <text y="32" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#F4F1DC" letter-spacing="2">LKBB BRAMASTA 4.0</text>
      <text y="48" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#D9D3A1" letter-spacing="2">BARISAN SEMANGAT PASKIBRA DEWATA</text>
      <line x1="-50" y1="56" x2="50" y2="56" stroke="#D9D3A1" stroke-width="1"/>
      <text y="70" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#C9C28A">Official Competitor & Supporter Edition</text>
    </g>
  </g>
  <!-- Label Tag -->
  <rect x="220" y="525" width="160" height="28" fill="#141210" rx="3"/>
  <text x="300" y="543" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#E6E1BC" text-anchor="middle" letter-spacing="2">TAMPAK DEPAN</text>
</svg>

